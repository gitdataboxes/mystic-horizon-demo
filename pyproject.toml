[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mystic-horizon"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "click>=8.1",
    "httpx>=0.27",
    "livekit==1.1.3",
    "livekit-agents==1.5.1",
    "livekit-api==1.1.0",
    "livekit-plugins-inworld==1.5.1",
    "livekit-plugins-deepgram==1.5.1",
    "livekit-plugins-openai==1.5.0",
    "livekit-plugins-silero==1.5.0",
    "livekit-plugins-turn-detector==1.5.1",
    "moonshine-voice>=0.0.51",
    "onnxruntime",
    "pydantic>=2.0",
    "sentencepiece>=0.2.1",
    "soundfile>=0.12",
    "sqlite-vec>=0.1",
    "structlog>=24.0",
    "tokenizers",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-benchmark>=5.1",
    "pytest-timeout>=2.4",
    "pyright>=1.1",
    "ruff>=0.5",
]

[project.scripts]
mystic-horizon = "mystic.cli:cli"
mystic = "mystic.cli:cli"

[tool.setuptools.packages.find]
where = [".", "vendor"]
include = ["mystic*", "pocket_tts_onnx*"]

[tool.setuptools.package-data]
mystic = ["_assets/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
python_files = ["test_*.py"]
testpaths = ["tests"]
timeout = 30
markers = ["bench: performance benchmarks (deselect with '-m not bench')"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["mystic", "tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
